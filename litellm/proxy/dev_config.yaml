mcp_servers:
  deepwiki:
    transport: "http"
    url: "https://mcp.deepwiki.com/mcp"
    allow_all_keys: true

general_settings:
  master_key: sk-1234
  # Opt-in: let CheckBatchCost track cost for unmanaged batches created with a raw
  # gs:// (Vertex) or s3:// (Bedrock) input_file_id. Requires a matching deployment
  # configured for the batched model. Defaults to false.
  # track_unmanaged_batch_cost: true

sandbox_tools:
  - sandbox_tool_name: e2b_sandbox
    litellm_params:
      sandbox_provider: e2b
      api_key: os.environ/E2B_API_KEY

litellm_settings:
  drop_params: True
  telemetry: False
  code_interpreter_interception_params:
    enabled: true
    sandbox_tool_name: e2b_sandbox
  callbacks:
    - code_interpreter_interception
    - otel

guardrails:
  - guardrail_name: "xecguard-mainline-stream"
    litellm_params:
      guardrail: xecguard
      mode: post_call
      api_key: os.environ/XECGUARD_API_KEY
      api_base: https://api-staging-xec.cycraft.ai/
      default_on: false
      stream_mode: window
      stream_chunk: 5
      stream_context: 2
      stream_first: true
      send_meta: true
      custom_header_meta_fields:
        - ComputerName
        - UserEmail
      policy_names:
        - Default_Policy_SystemPromptEnforcement
        - Default_Policy_PIISensitiveDataProtection
        - Default_Policy_GeneralPromptAttackProtection

  - guardrail_name: "xecguard-mcp-tooluse"
    litellm_params:
      guardrail: xecguard
      mode: [pre_mcp_call, during_mcp_call, post_mcp_call]
      api_key: os.environ/XECGUARD_API_KEY
      api_base: https://api-staging-xec.cycraft.ai/
      default_on: true
      policy_names:
        - Default_Policy_GeneralPromptAttackProtection

  - guardrail_name: "fruit_stream_window"
    litellm_params:
      guardrail: xecguard
      mode: post_call
      api_key: os.environ/XECGUARD_API_KEY
      api_base: https://api-staging-xec.cycraft.ai/
      default_on: false
      stream_mode: window
      stream_chunk: 5
      stream_context: 2
      stream_first: true
      policy_names: []
      custom_policy_names:
        - Fruit_Detection
      custom_policy_min_chars: 0

  - guardrail_name: "fruit_stream_window_hold"
    litellm_params:
      guardrail: xecguard
      mode: post_call
      api_key: os.environ/XECGUARD_API_KEY
      api_base: https://api-staging-xec.cycraft.ai/
      default_on: false
      stream_mode: window
      stream_chunk: 5
      stream_context: 2
      stream_first: false
      policy_names: []
      custom_policy_names:
        - Fruit_Detection
      custom_policy_min_chars: 0

  - guardrail_name: "fruit_stream_buffer"
    litellm_params:
      guardrail: xecguard
      mode: post_call
      api_key: os.environ/XECGUARD_API_KEY
      api_base: https://api-staging-xec.cycraft.ai/
      default_on: false
      stream_mode: buffer
      policy_names: []
      custom_policy_names:
        - Fruit_Detection
      custom_policy_min_chars: 0

  - guardrail_name: "fruit_nomin_pre"
    litellm_params:
      guardrail: xecguard
      mode: pre_call
      api_key: os.environ/XECGUARD_API_KEY
      api_base: https://api-staging-xec.cycraft.ai/
      default_on: false
      policy_names: []
      custom_policy_names:
        - Fruit_Detection
      custom_policy_min_chars: 0

  - guardrail_name: "fruit_default_min"
    litellm_params:
      guardrail: xecguard
      mode: pre_call
      api_key: os.environ/XECGUARD_API_KEY
      api_base: https://api-staging-xec.cycraft.ai/
      default_on: false
      policy_names: []
      custom_policy_names:
        - Fruit_Detection

  - guardrail_name: "sysprompt_enforce_pre"
    litellm_params:
      guardrail: xecguard
      mode: pre_call
      api_key: os.environ/XECGUARD_API_KEY
      api_base: https://api-staging-xec.cycraft.ai/
      default_on: false
      policy_names:
        - Default_Policy_SystemPromptEnforcement

  - guardrail_name: "sysprompt_stream_window"
    litellm_params:
      guardrail: xecguard
      mode: post_call
      api_key: os.environ/XECGUARD_API_KEY
      api_base: https://api-staging-xec.cycraft.ai/
      default_on: false
      stream_mode: window
      stream_chunk: 10
      stream_context: 4
      stream_first: true
      policy_names:
        - Default_Policy_SystemPromptEnforcement

  - guardrail_name: "sysprompt_stream_buffer"
    litellm_params:
      guardrail: xecguard
      mode: post_call
      api_key: os.environ/XECGUARD_API_KEY
      api_base: https://api-staging-xec.cycraft.ai/
      default_on: false
      stream_mode: buffer
      policy_names:
        - Default_Policy_SystemPromptEnforcement
